name: Build Audio Plugins (VST3, AU, AAX, CLAP, Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (optional, e.g. v1.1.8)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build
          cd ..

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package macOS Artifacts
        run: |
          mkdir -p artifacts/macOS
          cd build/plugin/Pressor2000_artefacts/Release
          
          if [ -d "AU/Pressor2000.component" ]; then
            cp -R "AU/Pressor2000.component" ../../../../artifacts/macOS/
          fi
          if [ -d "VST3/Pressor2000.vst3" ]; then
            cp -R "VST3/Pressor2000.vst3" ../../../../artifacts/macOS/
          fi
          if [ -d "Standalone/Pressor2000.app" ]; then
            cp -R "Standalone/Pressor2000.app" ../../../../artifacts/macOS/
          fi
          if [ -d "CLAP/Pressor2000.clap" ] || [ -f "CLAP/Pressor2000.clap" ]; then
            cp -R "CLAP/Pressor2000.clap" ../../../../artifacts/macOS/
          fi
          if [ -d "AAX/Pressor2000.aaxplugin" ]; then
            cp -R "AAX/Pressor2000.aaxplugin" ../../../../artifacts/macOS/
          fi
          
          cd ../../../../artifacts
          cp ../README.md macOS/ || true
          cp ../LICENSE macOS/ || true
          zip -r -y Pressor2000-macOS-Universal.zip macOS/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pressor2000-macOS
          path: artifacts/Pressor2000-macOS-Universal.zip
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build
          cd ..

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\webview2"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Configure CMake
        run: |
          cmake -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:RUNNER_TEMP\webview2"

      - name: Build Plugins
        shell: pwsh
        run: |
          $targets = @("Pressor2000_VST3", "Pressor2000_Standalone", "Pressor2000_CLAP")
          if (Test-Path "aax-sdk\Interfaces\AAX.h") {
            $targets += "Pressor2000_AAX"
          }
          cmake --build build --config Release --target $targets --parallel

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\Windows | Out-Null
          
          # VST3 bundle
          if (Test-Path "build\plugin\Pressor2000_artefacts\Release\VST3\Pressor2000.vst3") {
            Copy-Item -Recurse "build\plugin\Pressor2000_artefacts\Release\VST3\Pressor2000.vst3" "artifacts\Windows\"
          }
          
          # Standalone .exe
          if (Test-Path "build\plugin\Pressor2000_artefacts\Release\Standalone\Pressor2000.exe") {
            Copy-Item "build\plugin\Pressor2000_artefacts\Release\Standalone\Pressor2000.exe" "artifacts\Windows\"
          }
          
          # CLAP plugin
          if (Test-Path "build\plugin\Pressor2000_artefacts\Release\CLAP\Pressor2000.clap") {
            Copy-Item "build\plugin\Pressor2000_artefacts\Release\CLAP\Pressor2000.clap" "artifacts\Windows\"
          }
          
          # AAX bundle (Pro Tools)
          if (Test-Path "build\plugin\Pressor2000_artefacts\Release\AAX\Pressor2000.aaxplugin") {
            Copy-Item -Recurse "build\plugin\Pressor2000_artefacts\Release\AAX\Pressor2000.aaxplugin" "artifacts\Windows\"
          }
          
          # Documentation
          if (Test-Path "README.md") { Copy-Item "README.md" "artifacts\Windows\" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "artifacts\Windows\" }
          
          Compress-Archive -Path artifacts\Windows\* -DestinationPath artifacts\Pressor2000-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pressor2000-Windows
          path: artifacts/Pressor2000-Windows-x64.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Pressor2000-macOS
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Pressor2000-Windows
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (inputs.tag_name != '' && inputs.tag_name) || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
